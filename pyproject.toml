[project]
name = "infinitebacklog-mcp"
version = "2.1.0"
description = "API-only MCP server for Infinite Backlog v2: collection, ratings, reviews, play records, playthroughs, tags, achievements and stats through the site's own API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "infinitebacklog", "playwright"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "mcp>=2.0.0",
  "playwright>=1.40.0",
]

[project.scripts]
infinitebacklog-mcp = "infinitebacklog_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infinitebacklog_mcp"]
